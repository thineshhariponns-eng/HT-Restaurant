services:
  postgres:
    image: postgres:18-alpine
    container_name: teamomnifield-postgres
    environment:
      POSTGRES_DB: teamomnifield
      POSTGRES_USER: teamomnifield
      POSTGRES_PASSWORD: teamomnifield_dev_password
    volumes:
      - teamomnifield_pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamomnifield -d teamomnifield"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - teamomnifield

  web:
    build:
      context: .
      dockerfile: src/TeamOmnifield.Web/Dockerfile
    container_name: teamomnifield-web
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=teamomnifield;Username=teamomnifield;Password=teamomnifield_dev_password
      Restaurant__DeliveryFee: "40"
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    ports:
      - "8091:8080"
    volumes:
      - teamomnifield_dpkeys:/root/.aspnet/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - teamomnifield

  nginx:
    image: nginx:1.29-alpine
    container_name: teamomnifield-nginx
    ports:
      - "8090:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - teamomnifield

volumes:
  teamomnifield_pgdata:
  teamomnifield_dpkeys:

networks:
  teamomnifield:
    driver: bridge

<div class="border border-border-subtle bg-bg-surface p-6">
  <h2 class="font-display text-lg font-semibold text-text-primary">Order Summary</h2>

  <div class="mt-5 space-y-2.5 text-sm">
    @for (line of lines(); track line.slug) {
      <div class="flex items-start justify-between gap-3">
        <span class="text-text-body">
          {{ line.name }}
          <span class="text-text-muted">× {{ line.quantity }}</span>
        </span>
        <span class="shrink-0 tabular-nums text-text-primary">₹{{ line.price * line.quantity }}</span>
      </div>
    }
  </div>

  <dl class="mt-5 space-y-3 border-t border-border-subtle pt-5 text-sm">
    <div class="flex items-center justify-between">
      <dt class="text-text-body">Subtotal</dt>
      <dd class="tabular-nums text-text-primary">₹{{ subtotal() }}</dd>
    </div>
    <div class="flex items-center justify-between">
      <dt class="text-text-body">Tax</dt>
      <dd class="tabular-nums text-text-primary">₹{{ tax() }}</dd>
    </div>
    @if (delivery() > 0) {
      <div class="flex items-center justify-between">
        <dt class="text-text-body">Delivery</dt>
        <dd class="tabular-nums text-text-primary">₹{{ delivery() }}</dd>
      </div>
    }
  </dl>

  <div class="mt-4 flex items-center justify-between border-t border-border-strong pt-4">
    <span class="font-display text-base font-semibold text-text-primary">Total</span>
    <span class="font-display text-xl font-semibold tabular-nums text-primary-600">₹{{ total() }}</span>
  </div>

  <button
    type="button"
    [attr.aria-disabled]="submitDisabled()"
    (click)="onPlaceOrder()"
    class="mt-6 w-full px-5 py-3 text-sm font-semibold transition-colors duration-150"
    [class.bg-primary-600]="!submitDisabled()"
    [class.text-text-inverse]="!submitDisabled()"
    [class.hover:bg-primary-700]="!submitDisabled()"
    [class.bg-border-strong]="submitDisabled()"
    [class.text-text-muted]="submitDisabled()"
    [class.cursor-not-allowed]="submitDisabled()"
  >
    {{ submitLabel() }}
  </button>
</div>

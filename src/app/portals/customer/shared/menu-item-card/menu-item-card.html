<article
  class="flex h-full flex-col border border-border-subtle bg-bg-surface transition-colors duration-150 hover:border-primary-600"
>
  <a [routerLink]="['/menu', slug()]" class="contents">
    <div class="relative flex aspect-4/3 flex-col items-center justify-center gap-2 border-b border-border-subtle bg-bg-sunken text-text-muted">
      <svg class="h-8 w-8" [class.opacity-40]="!isAvailable()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 3v6a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V3M8 11v10M17 3c-2 1.2-2 3.4-2 5.5S16.5 13 18 13v8" />
      </svg>
      <span class="text-xs" [class.opacity-40]="!isAvailable()">Photo coming soon</span>

      @if (!isAvailable()) {
        <div class="absolute inset-0 flex items-center justify-center bg-bg-base/70">
          <span class="border border-border-strong px-3 py-1 text-xs font-semibold uppercase tracking-widest text-text-muted">
            Unavailable
          </span>
        </div>
      }
    </div>

    <div class="flex flex-1 flex-col gap-2 p-4 pb-0">
      <div class="flex items-start justify-between gap-2">
        <h3 class="font-display text-base font-semibold text-text-primary hover:text-primary-600">{{ name() }}</h3>

        @if (isVeg()) {
          <span
            class="mt-1 flex h-4 w-4 shrink-0 items-center justify-center border-2 border-status-delivered"
            title="Vegetarian"
            aria-label="Vegetarian"
          >
            <span class="h-1.5 w-1.5 rounded-full bg-status-delivered"></span>
          </span>
        }
      </div>

      @if (description()) {
        <p class="line-clamp-2 text-sm text-text-body">{{ description() }}</p>
      }

      <div class="mt-auto flex items-center justify-between pt-3">
        <span
          class="font-display text-lg font-semibold tabular-nums"
          [class.text-primary-600]="isAvailable()"
          [class.text-text-muted]="!isAvailable()"
        >
          ₹{{ price() }}
        </span>

        <span class="flex items-center gap-2 text-xs">
          <span
            class="h-1.5 w-1.5 rounded-full"
            [class.bg-status-delivered]="isAvailable()"
            [class.bg-text-muted]="!isAvailable()"
          ></span>
          <span [class.text-text-body]="isAvailable()" [class.text-text-muted]="!isAvailable()">
            {{ isAvailable() ? 'Available' : 'Unavailable' }}
          </span>
        </span>
      </div>
    </div>
  </a>

  <div class="p-4 pt-3">
    <button
      type="button"
      [disabled]="!isAvailable()"
      (click)="onAddToCart()"
      class="w-full px-4 py-2.5 text-sm font-semibold transition-colors duration-150 active:translate-y-px"
      [class.bg-primary-600]="isAvailable()"
      [class.text-text-inverse]="isAvailable()"
      [class.hover:bg-primary-700]="isAvailable()"
      [class.bg-bg-sunken]="!isAvailable()"
      [class.text-text-muted]="!isAvailable()"
      [class.cursor-not-allowed]="!isAvailable()"
    >
      {{ isAvailable() ? 'Add to Cart' : 'Unavailable' }}
    </button>
  </div>
</article>

<article class="flex flex-wrap items-center gap-4 border-b border-border-subtle py-5 sm:flex-nowrap">
  <div class="flex h-20 w-20 shrink-0 items-center justify-center border border-border-subtle bg-bg-sunken text-text-muted">
    <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M6 3v6a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V3M8 11v10M17 3c-2 1.2-2 3.4-2 5.5S16.5 13 18 13v8" />
    </svg>
  </div>

  <div class="min-w-0 flex-1 basis-full sm:basis-auto">
    <a
      [routerLink]="['/menu', slug()]"
      class="font-display text-base font-semibold text-text-primary transition-colors duration-150 hover:text-primary-600"
    >
      {{ name() }}
    </a>
    <p class="mt-1 text-sm tabular-nums text-text-muted">₹{{ price() }} each</p>
  </div>

  <app-quantity-selector [quantity]="quantity()" (increment)="onIncrement()" (decrement)="onDecrement()" />

  <p class="w-20 shrink-0 text-right font-display text-base font-semibold tabular-nums text-primary-600">
    ₹{{ lineTotal() }}
  </p>

  <button
    type="button"
    (click)="onRemove()"
    class="shrink-0 text-sm font-medium text-text-muted transition-colors duration-150 hover:text-status-cancelled"
  >
    Remove
  </button>
</article>

<div class="flex flex-wrap gap-1" role="group" aria-label="Filter orders by status">
  @for (option of options; track option.value) {
    <button
      type="button"
      [attr.aria-pressed]="selected() === option.value"
      [attr.data-testid]="'filter-' + option.value"
      (click)="select(option.value)"
      class="flex items-baseline gap-1.5 border-b-2 px-2 py-2 sm:gap-2 sm:px-3 text-sm font-medium transition-colors duration-150 hover:border-primary-600 hover:text-primary-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-600"
      [class.border-primary-600]="selected() === option.value"
      [class.text-primary-600]="selected() === option.value"
      [class.border-transparent]="selected() !== option.value"
      [class.text-text-body]="selected() !== option.value"
    >
      {{ option.label }}
      <span
        class="text-xs tabular-nums"
        [class.text-primary-600]="selected() === option.value"
        [class.text-text-muted]="selected() !== option.value"
      >
        {{ counts()[option.value] }}
      </span>
    </button>
  }
</div>

<a
  routerLink="/cart"
  class="relative inline-flex items-center gap-2 rounded-md border px-3 py-2 text-sm font-medium transition-colors duration-150"
  [class.border-border-subtle]="!hasItems()"
  [class.text-text-primary]="!hasItems()"
  [class.bg-bg-surface]="!hasItems()"
  [class.border-accent-600]="hasItems()"
  [class.bg-accent-600]="hasItems()"
  [class.text-text-inverse]="hasItems()"
  [attr.aria-label]="hasItems() ? displayCount() + ' items in cart' : 'View cart'"
>
  <svg
    class="h-5 w-5"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.75"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <circle cx="9" cy="20" r="1" />
    <circle cx="18" cy="20" r="1" />
    <path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 8H6" />
  </svg>

  <span class="hidden sm:inline">Cart</span>

  @if (hasItems()) {
    <span
      class="flex h-5 min-w-5 items-center justify-center rounded-full bg-primary-600 px-1 text-xs font-semibold text-text-inverse"
    >
      {{ displayCount() }}
    </span>
  }
</a>

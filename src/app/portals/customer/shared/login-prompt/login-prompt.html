<dialog
  #dialog
  aria-labelledby="login-prompt-title"
  aria-describedby="login-prompt-description"
  (pointerdown)="onPointerDown($event)"
  (click)="onClick($event)"
  (cancel)="close()"
  class="m-auto w-[calc(100%-2rem)] max-w-md border border-border-strong bg-bg-surface text-text-body"
>
  <div class="px-5 pb-7 pt-5 sm:px-8 sm:pb-8">
    <div class="flex justify-end">
      <button
        type="button"
        (click)="close()"
        aria-label="Close"
        data-testid="login-prompt-close"
        class="-mr-2 flex h-9 w-9 items-center justify-center text-text-muted transition-colors duration-150 hover:text-text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-600"
      >
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </div>

    <h2 id="login-prompt-title" class="mt-1 font-display text-2xl font-semibold text-text-primary sm:text-3xl">Log in to order</h2>
    <p id="login-prompt-description" class="mt-3 text-text-body">Please log in to add items to your cart.</p>

    <button
      type="button"
      (click)="goToLogin()"
      data-testid="login-prompt-login"
      class="mt-7 inline-flex w-full items-center justify-center bg-primary-600 px-5 py-3 text-sm font-semibold text-text-inverse transition-colors duration-150 hover:bg-primary-700 active:translate-y-px focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-600"
    >
      Log In
    </button>
  </div>
</dialog>

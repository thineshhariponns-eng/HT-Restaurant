<fieldset [attr.aria-describedby]="invalid() ? errorId : null">
  <legend class="text-xs font-semibold uppercase tracking-widest text-text-muted">Cancellation reason</legend>

  <div
    class="mt-3 divide-y divide-border-subtle border transition-colors duration-150"
    [class.border-border-subtle]="!invalid()"
    [class.border-error]="invalid()"
  >
    @for (option of options(); track option.value) {
      <label
        class="group flex min-h-12 cursor-pointer items-center gap-4 px-4 py-3 text-sm text-text-body transition-colors duration-150 has-[:checked]:bg-primary-100 has-[:checked]:text-text-primary has-[:focus-visible]:outline-2 has-[:focus-visible]:-outline-offset-2 has-[:focus-visible]:outline-primary-600"
      >
        <span class="relative flex h-4 w-4 shrink-0 items-center justify-center">
          <input
            type="radio"
            [name]="groupName"
            [value]="option.value"
            [formControl]="control()"
            [attr.aria-invalid]="invalid()"
            [attr.data-testid]="'reason-' + option.value"
            class="peer absolute inset-0 m-0 h-4 w-4 cursor-pointer appearance-none rounded-full border-[1.5px] border-border-strong transition-colors duration-150 group-hover:border-primary-600 checked:border-primary-600 focus-visible:outline-none"
          />
          <span class="pointer-events-none hidden h-1.5 w-1.5 rounded-full bg-primary-600 peer-checked:block" aria-hidden="true"></span>
        </span>
        <span class="transition-colors duration-150 group-hover:text-text-primary">{{ option.label }}</span>
      </label>
    }
  </div>

  @if (invalid()) {
    <p [id]="errorId" class="mt-2 flex items-center gap-1.5 text-xs font-medium text-error">
      <svg class="h-3.5 w-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 8v4M12 16h.01" />
      </svg>
      Choose a reason to cancel.
    </p>
  }
</fieldset>

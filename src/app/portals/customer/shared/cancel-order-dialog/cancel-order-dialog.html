<dialog
  #dialog
  [attr.aria-labelledby]="titleId"
  [attr.aria-describedby]="descriptionId"
  (pointerdown)="onPointerDown($event)"
  (click)="onClick($event)"
  class="m-0 mt-auto max-h-none w-full max-w-none border-t border-border-strong bg-bg-surface text-text-body sm:m-auto sm:max-w-lg sm:border"
>
  <div class="flex max-h-[90dvh] flex-col sm:max-h-[85dvh]">
    <div class="sheet-body overflow-y-auto overscroll-contain px-5 pb-7 pt-6 sm:px-8 sm:pt-7">
      <div class="flex items-start justify-between gap-4">
        <h2 [id]="titleId" class="font-display text-2xl font-semibold text-text-primary sm:text-3xl">Cancel Order?</h2>
        <button
          type="button"
          (click)="close()"
          aria-label="Close and keep order"
          class="-mr-2 -mt-1 flex h-9 w-9 shrink-0 items-center justify-center text-text-muted transition-colors duration-150 hover:text-text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-600"
        >
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>

      <p [id]="descriptionId" class="mt-3 max-w-sm text-text-body">
        Are you sure you want to cancel order
        <span class="whitespace-nowrap font-semibold tabular-nums text-text-primary">#{{ order().orderNumber }}</span>?
      </p>

      <div class="mt-6 flex items-end justify-between gap-4 border-t border-border-strong bg-bg-sunken px-4 py-4">
        <div>
          <p class="text-xs font-semibold uppercase tracking-widest text-text-muted">Order Total</p>
          <p class="mt-1 text-sm tabular-nums text-text-body">
            {{ order().type === 'delivery' ? 'Delivery' : 'Pickup' }} &middot; {{ itemCount() }}
            {{ itemCount() === 1 ? 'item' : 'items' }}
          </p>
        </div>
        <p class="font-display text-3xl font-semibold tabular-nums text-primary-600" data-testid="cancel-total">₹{{ order().total }}</p>
      </div>

      <div class="mt-7">
        <app-cancellation-reason-selector [control]="reason" [type]="order().type" [invalid]="reasonInvalid()" />
      </div>

      <div class="mt-6">
        <app-form-textarea
          [control]="note"
          [id]="noteId"
          label="Additional note"
          placeholder="Anything else the restaurant should know"
          [required]="noteRequired()"
          [rows]="3"
          [maxLength]="noteMaxLength"
          [errorMessages]="noteErrors"
        />
      </div>
    </div>

    <div class="flex flex-col-reverse gap-3 border-t border-border-subtle px-5 py-4 sm:flex-row sm:justify-end sm:px-8 sm:py-5">
      <button
        type="button"
        autofocus
        (click)="close()"
        data-testid="keep-order"
        class="border border-border-strong px-5 py-3 text-sm font-semibold text-text-primary transition-colors duration-150 hover:border-primary-600 hover:text-primary-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-600"
      >
        Keep Order
      </button>
      <button
        type="button"
        (click)="confirm()"
        data-testid="confirm-cancel"
        class="inline-flex items-center justify-center gap-2 border border-error px-5 py-3 text-sm font-semibold text-text-primary transition-colors duration-150 hover:bg-error-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-600"
      >
        <svg class="h-4 w-4 text-error" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
        Cancel Order
      </button>
    </div>
  </div>
</dialog>

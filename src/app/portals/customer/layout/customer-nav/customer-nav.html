<ul
  class="flex gap-1 text-sm font-medium"
  [class.flex-row]="variant() === 'horizontal'"
  [class.items-center]="variant() === 'horizontal'"
  [class.flex-col]="variant() === 'stacked'"
  [class.gap-2]="variant() === 'stacked'"
>
  @for (link of links; track link.path) {
    <li [class.lg:ml-2]="link.staff" [class.lg:border-l]="link.staff" [class.border-border-subtle]="link.staff">
      <a
        [routerLink]="link.path"
        [class.text-text-muted]="link.staff"
        routerLinkActive="border-primary-600 text-primary-600"
        [routerLinkActiveOptions]="{ exact: link.exact }"
        (click)="onLinkClick()"
        class="block border-b-2 border-transparent px-3 text-text-body transition-colors duration-150 hover:border-primary-600 hover:text-text-primary"
        [class.py-2]="variant() === 'horizontal'"
        [class.py-3]="variant() === 'stacked'"
      >
        {{ link.label }}
      </a>
    </li>
  }
</ul>

<header class="sticky top-0 z-40 border-b border-border-subtle bg-bg-surface">
  <div class="mx-auto flex h-16 max-w-6xl items-center justify-between gap-4 px-4 sm:px-6 lg:px-8">
    <a routerLink="/" class="flex items-baseline gap-2" (click)="closeMobileMenu()">
      <span class="font-display text-xl font-semibold text-text-primary">HT Restaurant</span>
      <span class="text-xs font-medium uppercase tracking-widest text-primary-600">Erode</span>
    </a>

    <nav class="hidden lg:block" aria-label="Primary">
      <app-customer-nav />
    </nav>

    <div class="flex items-center gap-2">
      <app-cart-button [itemCount]="cartItemCount()" />

      <button
        type="button"
        class="inline-flex h-11 w-11 items-center justify-center rounded-md border border-border-subtle text-text-primary transition-colors duration-150 hover:border-primary-600 lg:hidden"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="mobileMenuOpen()"
        aria-controls="mobile-nav"
        aria-label="Toggle menu"
      >
        @if (mobileMenuOpen()) {
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        } @else {
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        }
      </button>
    </div>
  </div>

  @if (mobileMenuOpen()) {
    <div id="mobile-nav" class="border-t border-border-subtle bg-bg-surface px-4 py-4 lg:hidden">
      <app-customer-nav variant="stacked" (linkClick)="closeMobileMenu()" />
    </div>
  }
</header>

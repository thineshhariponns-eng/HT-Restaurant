<a
  routerLink="/developer/dashboard"
  class="block border-b border-border-subtle px-5 pt-6 pb-5"
  (click)="navigated.emit()"
>
  <span class="block font-display text-lg leading-tight font-semibold text-text-primary">
    HT Restaurant
  </span>
  <span class="label-caps mt-1 block text-text-muted">Platform · Consultant</span>
</a>

<nav aria-label="Consultant" class="flex-1 overflow-y-auto px-3 py-4">
  @for (group of groups; track group.label) {
    <p class="label-caps px-3 pt-4 pb-2 text-text-muted first:pt-0" [id]="'nav-' + group.label">
      {{ group.label }}
    </p>
    <ul role="list" [attr.aria-labelledby]="'nav-' + group.label">
      @for (link of group.links; track link.path) {
        <li>
          <a
            [routerLink]="link.path"
            routerLinkActive="bg-primary-100 text-primary-600"
            [routerLinkActiveOptions]="{ exact: false }"
            ariaCurrentWhenActive="page"
            class="flex h-9 items-center px-3 text-sm font-medium text-text-body transition-colors hover:bg-primary-100 hover:text-text-primary"
            (click)="navigated.emit()"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>
  }
</nav>

<div class="border-t border-border-subtle px-3 py-3">
  <p class="px-3 text-xs leading-relaxed text-text-muted">
    Demo mode. Sample data only; changes reset when you reload.
  </p>
</div>

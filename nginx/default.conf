server {
    listen 80;
    server_name htrestaurant.com;
    location / {
        proxy_pass http://web:8080;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

